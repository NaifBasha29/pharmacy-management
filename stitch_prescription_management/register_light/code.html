<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f97415",
                        "background-light": "#f8f7f5",
                        "background-dark": "#23170f",
                    },
                    fontFamily: {
                        "display": ["Manrope"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<title>RxHub - Join Now</title>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased">
<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
<!-- Header -->
<div class="flex items-center px-4 py-4 md:px-8 justify-between sticky top-0 bg-background-light/80 backdrop-blur-md z-10">
<div class="text-slate-900 dark:text-slate-100 flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-primary/10 cursor-pointer">
<span class="material-symbols-outlined">arrow_back</span>
</div>
<div class="flex-1 text-center">
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-[-0.015em]">Create Account</h2>
</div>
<div class="size-10"></div> <!-- Spacer for balance -->
</div>
<!-- Main Content Container -->
<div class="flex flex-col max-w-[480px] mx-auto w-full flex-1 px-6 pb-12 pt-8">
<!-- Welcome Section -->
<div class="mb-8">
<div class="bg-primary/10 w-16 h-16 rounded-2xl flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-primary text-4xl">medical_services</span>
</div>
<h1 class="text-slate-900 dark:text-slate-100 tracking-tight text-[32px] font-bold leading-tight">Join RxHub</h1>
<p class="text-slate-600 dark:text-slate-400 text-base font-normal leading-relaxed mt-2">Enter your details to get started with your digital pharmaceutical hub.</p>
</div>
<!-- Registration Form -->
<form class="space-y-5">
<!-- Full Name -->
<div class="flex flex-col w-full">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold pb-2 px-1">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">person</span>
<input class="form-input flex w-full rounded-xl text-slate-900 dark:text-slate-100 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 h-14 pl-12 pr-4 placeholder:text-slate-400 text-base transition-all" placeholder="John Doe" type="text"/>
</div>
</div>
<!-- Email Address -->
<div class="flex flex-col w-full">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold pb-2 px-1">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">mail</span>
<input class="form-input flex w-full rounded-xl text-slate-900 dark:text-slate-100 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 h-14 pl-12 pr-4 placeholder:text-slate-400 text-base transition-all" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Password -->
<div class="flex flex-col w-full">
<label class="text-slate-700 dark:text-slate-300 text-sm font-semibold pb-2 px-1">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">lock</span>
<input class="form-input flex w-full rounded-xl text-slate-900 dark:text-slate-100 focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 h-14 pl-12 pr-12 placeholder:text-slate-400 text-base transition-all" placeholder="••••••••" type="password"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 cursor-pointer hover:text-primary">visibility</span>
</div>
</div>
<!-- Agreement Toggle (Custom Style) -->
<div class="flex items-start gap-3 py-2">
<input class="mt-1 h-5 w-5 rounded border-slate-300 text-primary focus:ring-primary transition-all cursor-pointer" id="terms" type="checkbox"/>
<label class="text-sm text-slate-600 dark:text-slate-400 leading-tight" for="terms">
                        I agree to the <a class="text-primary font-semibold hover:underline" href="#">Terms of Service</a> and <a class="text-primary font-semibold hover:underline" href="#">Privacy Policy</a>.
                    </label>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 px-6 rounded-xl shadow-lg shadow-primary/20 transition-all active:scale-[0.98] mt-4 flex items-center justify-center gap-2" type="submit">
<span>Create My Account</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Social Registration -->
<div class="mt-8">
<div class="relative flex items-center py-4">
<div class="flex-grow border-t border-slate-200 dark:border-slate-800"></div>
<span class="flex-shrink mx-4 text-slate-400 text-xs font-semibold uppercase tracking-widest">Or sign up with</span>
<div class="flex-grow border-t border-slate-200 dark:border-slate-800"></div>
</div>
<div class="grid grid-cols-2 gap-4 mt-4">
<button class="flex items-center justify-center gap-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl py-3 px-4 hover:bg-slate-50 dark:hover:bg-slate-800 transition-all group">
<img alt="Google logo" class="w-5 h-5" data-alt="Google colorful logo icon" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC7wsE7ahQCzqiHlgH2Uwf9LCEJL5f3gWZLcLRenCTM_ln0dqeQuZldH50DYFxCZeuYPJr05KSnbqIV371Oe9jWC5FM9SFtsPqA8k5ubbubpbY195BAcS_lghu9LRaJ6_2U1iNQcilPa2kUbCTRZKvaTRvaOXsekSWC_TMNB0zxB8PunzFoqqcTUM0onDtMnG2xOeVhyOEZtU2sAczOy5-MzjGKgBKMpJia1ZNNFdlWPJ5DRbDW66HKUaeJ0Wz2jPcWdO3YXAt-bQ"/>
<span class="text-slate-700 dark:text-slate-300 font-medium">Google</span>
</button>
<button class="flex items-center justify-center gap-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl py-3 px-4 hover:bg-slate-50 dark:hover:bg-slate-800 transition-all group">
<span class="material-symbols-outlined text-[#1877F2]">social_leaderboard</span>
<span class="text-slate-700 dark:text-slate-300 font-medium">Facebook</span>
</button>
</div>
</div>
<!-- Footer Login Link -->
<p class="mt-auto pt-8 text-center text-slate-600 dark:text-slate-400">
                Already have an account? 
                <a class="text-primary font-bold hover:underline" href="#">Log In</a>
</p>
</div>
<!-- Abstract Decorative Element (Bottom Corner) -->
<div class="fixed -bottom-20 -right-20 w-64 h-64 bg-primary/5 rounded-full blur-3xl -z-10 pointer-events-none"></div>
</div>
</body></html>
