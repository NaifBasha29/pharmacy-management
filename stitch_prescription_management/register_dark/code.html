<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f97415",
                        "background-light": "#f8f7f5",
                        "background-dark": "#23170f",
                    },
                    fontFamily: {
                        "display": ["Manrope"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<div class="relative flex flex-col w-full max-w-md mx-auto min-h-screen p-6 md:p-8">
<div class="flex flex-col items-center justify-center pt-8 pb-10">
<div class="flex items-center justify-center w-16 h-16 bg-primary/10 rounded-xl mb-4">
<span class="material-symbols-outlined text-primary text-4xl">medical_services</span>
</div>
<h1 class="text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white">RxHub</h1>
<p class="text-slate-500 dark:text-primary/70 font-medium text-sm mt-1">Your Healthcare Partner</p>
</div>
<div class="flex flex-col flex-1">
<div class="mb-8">
<h2 class="text-2xl font-bold text-slate-900 dark:text-slate-100">Create Account</h2>
<p class="text-slate-500 dark:text-slate-400 mt-2">Join us today and manage your prescriptions easily.</p>
</div>
<form class="space-y-5">
<div>
<label class="block text-sm font-semibold mb-2 text-slate-700 dark:text-slate-300">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">person</span>
<input class="w-full pl-12 pr-4 py-4 rounded-xl border border-slate-200 dark:border-primary/20 bg-white dark:bg-primary/5 focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-600" placeholder="John Doe" type="text"/>
</div>
</div>
<div>
<label class="block text-sm font-semibold mb-2 text-slate-700 dark:text-slate-300">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">mail</span>
<input class="w-full pl-12 pr-4 py-4 rounded-xl border border-slate-200 dark:border-primary/20 bg-white dark:bg-primary/5 focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-600" placeholder="john@example.com" type="email"/>
</div>
</div>
<div>
<label class="block text-sm font-semibold mb-2 text-slate-700 dark:text-slate-300">Phone Number</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">phone</span>
<input class="w-full pl-12 pr-4 py-4 rounded-xl border border-slate-200 dark:border-primary/20 bg-white dark:bg-primary/5 focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-600" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
</div>
<div>
<label class="block text-sm font-semibold mb-2 text-slate-700 dark:text-slate-300">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">lock</span>
<input class="w-full pl-12 pr-12 py-4 rounded-xl border border-slate-200 dark:border-primary/20 bg-white dark:bg-primary/5 focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-600" placeholder="••••••••" type="password"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 cursor-pointer">visibility</span>
</div>
</div>
<div class="flex items-start gap-3 py-2">
<div class="flex items-center h-5">
<input class="w-5 h-5 rounded border-slate-300 dark:border-primary/30 bg-white dark:bg-primary/10 text-primary focus:ring-primary cursor-pointer" id="terms" type="checkbox"/>
</div>
<label class="text-sm text-slate-600 dark:text-slate-400 leading-tight" for="terms">
                        I agree to the <a class="text-primary hover:underline font-medium" href="#">Terms of Service</a> and <a class="text-primary hover:underline font-medium" href="#">Privacy Policy</a>
</label>
</div>
<button class="w-full py-4 rounded-xl bg-gradient-to-r from-primary to-[#fb923c] text-white font-bold text-lg shadow-lg shadow-primary/20 hover:shadow-primary/40 transition-all active:scale-[0.98] mt-4" type="submit">
                    Create Account
                </button>
</form>
</div>
<div class="mt-auto py-8 text-center">
<p class="text-slate-600 dark:text-slate-400">
                Already have an account? 
                <a class="text-primary font-bold hover:underline ml-1" href="#">Login</a>
</p>
</div>
</div>
</body></html>
