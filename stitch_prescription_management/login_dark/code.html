<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#f97415",
              "background-light": "#f8f7f5",
              "background-dark": "#23170f",
            },
            fontFamily: {
              "display": ["Manrope"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-[440px] flex flex-col items-center">
<!-- Logo Area -->
<div class="mb-8 flex flex-col items-center">
<div class="w-16 h-16 bg-primary rounded-xl flex items-center justify-center mb-4 shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-white text-4xl">medical_services</span>
</div>
<h2 class="text-3xl font-extrabold tracking-tight text-slate-900 dark:text-slate-100">RxHub</h2>
</div>
<!-- Card Container -->
<div class="w-full bg-white dark:bg-primary/5 border border-slate-200 dark:border-primary/10 rounded-xl p-8 shadow-xl">
<div class="text-center mb-8">
<h1 class="text-2xl font-bold text-slate-900 dark:text-slate-100">Welcome back</h1>
<p class="text-slate-500 dark:text-primary/60 text-sm mt-2 font-medium">Please enter your details to sign in</p>
</div>
<!-- Form -->
<form class="space-y-5" onsubmit="return false;">
<div>
<label class="block text-sm font-semibold text-slate-700 dark:text-primary/80 mb-2">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 dark:text-primary/40 text-[20px]">mail</span>
<input class="w-full pl-11 pr-4 py-3.5 rounded-lg border border-slate-200 dark:border-primary/20 bg-slate-50 dark:bg-background-dark text-slate-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all placeholder:text-slate-400 dark:placeholder:text-primary/30" placeholder="name@example.com" type="email"/>
</div>
</div>
<div>
<div class="flex justify-between items-center mb-2">
<label class="block text-sm font-semibold text-slate-700 dark:text-primary/80">Password</label>
<a class="text-xs font-bold text-primary hover:text-primary/80 transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 dark:text-primary/40 text-[20px]">lock</span>
<input class="w-full pl-11 pr-12 py-3.5 rounded-lg border border-slate-200 dark:border-primary/20 bg-slate-50 dark:bg-background-dark text-slate-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all placeholder:text-slate-400 dark:placeholder:text-primary/30" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 dark:text-primary/40 hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<button class="w-full py-4 px-6 rounded-lg bg-gradient-to-r from-primary to-[#fb923c] text-white font-bold text-base shadow-lg shadow-primary/25 hover:shadow-primary/40 transition-all active:scale-[0.98] mt-2">
                    Sign In
                </button>
</form>
<!-- Divider -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-slate-200 dark:border-primary/10"></div>
</div>
<div class="relative flex justify-center text-sm uppercase">
<span class="px-4 bg-white dark:bg-background-dark text-slate-400 dark:text-primary/40 font-medium tracking-wider text-[10px]">Or continue with</span>
</div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 py-3 px-4 rounded-lg border border-slate-200 dark:border-primary/20 bg-white dark:bg-background-dark hover:bg-slate-50 dark:hover:bg-primary/5 transition-colors group">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="text-sm font-semibold text-slate-700 dark:text-primary/80 group-hover:text-slate-900 dark:group-hover:text-white">Google</span>
</button>
<button class="flex items-center justify-center gap-2 py-3 px-4 rounded-lg border border-slate-200 dark:border-primary/20 bg-white dark:bg-background-dark hover:bg-slate-50 dark:hover:bg-primary/5 transition-colors group">
<svg class="w-5 h-5 fill-slate-900 dark:fill-white" viewbox="0 0 24 24">
<path d="M17.05 20.28c-.96.95-2.04 1.72-3.1 1.72-1.2 0-1.57-.74-2.95-.74-1.37 0-1.8.72-2.95.72-1.07 0-2.23-.84-3.23-1.85C2.8 18.15 1.5 15.06 1.5 12.18c0-3.08 2-4.71 3.95-4.71 1.03 0 1.9.62 2.62.62.7 0 1.63-.64 2.83-.64 1.14 0 2.22.47 3.01 1.25-2.48 1.41-2.06 4.88.39 5.86-.91 2.27-1.84 4.38-3.25 5.72zM12.03 7.25c-.02-2.23 1.83-4.07 4.04-4.25.19 2.4-2.18 4.41-4.04 4.25z"></path>
</svg>
<span class="text-sm font-semibold text-slate-700 dark:text-primary/80 group-hover:text-slate-900 dark:group-hover:text-white">Apple</span>
</button>
</div>
</div>
<!-- Sign Up Link -->
<p class="mt-8 text-sm font-medium text-slate-500 dark:text-primary/50">
            Don't have an account? 
            <a class="text-primary hover:text-primary/80 font-bold ml-1 transition-colors" href="#">Create an account</a>
</p>
<!-- Footer Decor -->
<div class="mt-12 opacity-20 flex gap-4 grayscale">
<span class="material-symbols-outlined text-4xl">verified_user</span>
<span class="material-symbols-outlined text-4xl">encrypted</span>
<span class="material-symbols-outlined text-4xl">health_metrics</span>
</div>
</div>
</body></html>
